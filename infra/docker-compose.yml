# Dev infrastructure only; apps run on the host for hot reload (docs/08-deployment.md).
# Run from repo root: docker compose -f infra/docker-compose.yml --env-file .env up -d --wait
name: troviec
services:
  postgres:
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: troviec
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?set in .env}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?set in .env}
      APP_WORKER_PASSWORD: ${APP_WORKER_PASSWORD:?set in .env}
      APP_MAINTENANCE_PASSWORD: ${APP_MAINTENANCE_PASSWORD:?set in .env}
      APP_REPORTING_PASSWORD: ${APP_REPORTING_PASSWORD:?set in .env}
      APP_RESEARCH_PASSWORD: ${APP_RESEARCH_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql        # PostgreSQL 18+: new volume path
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]   # change if a local PostgreSQL already uses 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d troviec"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}   # never in garage.toml (committed)
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports: ["3900:3900", "3902:3902"]

  mailpit:                                 # fake SMTP, UI at http://localhost:8025
    image: axllent/mailpit:v1.33.1
    ports: ["1025:1025", "8025:8025"]

volumes: { pgdata: {}, redisdata: {}, garage-meta: {}, garage-data: {} }
